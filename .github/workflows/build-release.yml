name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'

      - name: Regenerate Windows platform files
        shell: bash
        run: |
          rm -rf windows
          flutter create . --platforms=windows --org com.asr.client --project-name asr_client

      - name: Force VS 2022 generator in Flutter config
        shell: pwsh
        run: |
          $configFile = "windows/flutter/ephemeral/generated_config.cmake"
          if (Test-Path $configFile) {
            $content = Get-Content $configFile -Raw
            $content = $content -replace 'Visual Studio 16 2019', 'Visual Studio 17 2022'
            Set-Content $configFile $content -NoNewline
            Write-Host "Patched generated_config.cmake for VS 2022"
          } else {
            Write-Host "WARNING: generated_config.cmake not found"
          }

      - run: flutter pub get

      - name: Build Windows Release
        shell: pwsh
        run: |
          $env:CMAKE_GENERATOR = "Visual Studio 17 2022"
          flutter build windows --release

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\ASR-Client-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: client/build/ASR-Client-Windows.zip

  release:
    name: Create GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-apk/app-release.apk
            artifacts/windows-exe/ASR-Client-Windows.zip
          generate_release_notes: true
